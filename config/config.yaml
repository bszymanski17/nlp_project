data:
  cat_features: ["Category", "Company", "LocationNormalized", "ContractType", "ContractTime"]
  text_features: ["FullDescription"]
  target: "SalaryNormalized"

preprocessing:
  max_len: 300
  min_freq: 10

model:
  emb_dim_text: 64
  emb_dim_cat: 16
  layers_size: [128, 64, 16]

training:
  batch_size: 64
  epochs: 15
  patience: 4
  random_state: 123

mlflow:
  experiment_name: "Salary_predictions"
  run_id: '9001ef40716446d9b9b9a7e327c2ba92'
  model_name: 'salary_model'

paths:
  input_data_train: "data/Train_rev1.csv"
  input_data_pred: "data/Train_rev1.csv"
  artifacts_dir: "artifacts"
  model_save: "artifacts/self_taught_model.pth"
  preprocessor_save: "artifacts/preprocessor.pkl"
  prediction_results: "data/predictions_results.csv"
  tracking_uri: "sqlite:///mlflow.db"
